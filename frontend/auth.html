<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page">
    <div class="user-details">
        <div id="login">
            <div class="auth-heading">
                <h1>Concord</h1>
                <h2>Sign in</h2>
            </div>
            <label for="loginEmail">Email:</label>
            <input type="text" id="loginEmail">
            <label for="loginPassword">Password:</label>
            <div class="password-box">
            <input type="password" id="loginPassword">
            <span class="eye" onclick="togglePassword('loginPassword')"></span>
            </div>
            <button class="btn1" id="loginuser" onclick="loginUser()">Login</button>
            <button class="newBtn" onclick="showRegister()">New user? Register</button>
        </div>
        <div id="register">
            <div class="auth-heading">
                <h1>Concord</h1>
                <h2>Create your account</h2>
            </div>
            <label for="employee_id">Employee ID:</label>
            <input type="text" id="employee_id">
            <label for="full_name">Full Name:</label>
            <input type="text" id="full_name">
            <label for="email">Email:</label>
            <input type="text" id="email">
            <label for="password">Password:</label>
            <div class="password-box">
            <input type="password" id="password">
            <span class="eye" onclick="togglePassword('password')"></span>
            </div>
            <button class="btn1" id="registeruser" onclick="registerUser()">Register</button>
            <button class="newBtn" onclick="showLogin()">Already have an account? Login</button>
        </div>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
